<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecomix - Sistema de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .producto-card { 
            cursor: pointer; 
            transition: all 0.3s; 
            height: 100%;
        }
        .producto-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .carrito-item {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }
        .stock-bajo {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-shop"></i> Ecomix - Sistema de Ventas
            </span>
            <div class="text-white">
                <span id="hora-actual"></span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <div class="row">
            <!-- Columna Productos -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-light d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-grid"></i> Productos Disponibles</h5>
                        <div class="d-flex">
                            <input type="text" class="form-control me-2" placeholder="Buscar producto..." id="buscador">
                            <button class="btn btn-outline-success btn-sm" onclick="cargarProductos()">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row" id="lista-productos">
                            <!-- Los productos cargan aquí dinámicamente -->
                            <div class="col-12 text-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Cargando...</span>
                                </div>
                                <p>Cargando productos...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Columna Carrito -->
            <div class="col-md-4">
                <div class="card sticky-top" style="top: 20px;">
                    <div class="card-header bg-warning">
                        <h5 class="mb-0"><i class="bi bi-cart"></i> Carrito de Venta</h5>
                    </div>
                    <div class="card-body">
                        <div id="carrito-items" style="max-height: 400px; overflow-y: auto;">
                            <p class="text-muted text-center">No hay productos en el carrito</p>
                        </div>
                        <div class="mt-3 p-3 bg-light rounded">
                            <div class="d-flex justify-content-between align-items-center">
                                <strong>Total:</strong>
                                <strong class="fs-4">$<span id="total-carrito">0</span></strong>
                            </div>
                            <button class="btn btn-success w-100 mt-3" onclick="procesarVenta()">
                                <i class="bi bi-credit-card"></i> Procesar Venta
                            </button>
                            <button class="btn btn-outline-danger w-100 mt-2" onclick="limpiarCarrito()">
                                <i class="bi bi-trash"></i> Limpiar Carrito
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Alertas -->
    <div id="alert-container" style="position: fixed; top: 80px; right: 20px; z-index: 1000;"></div>

    <!-- Modal de Venta Exitosa -->
    <div class="modal fade" id="ventaModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"> Venta Exitosa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="venta-mensaje"></p>
                    <div id="venta-detalles"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" onclick="imprimirTicket()">Imprimir Ticket</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
