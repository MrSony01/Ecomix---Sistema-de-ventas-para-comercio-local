<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - Ecomix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-store"></i> Ecomix
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="pos.html"><i class="fas fa-cash-register"></i> Punto de Venta</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="inventory.html"><i class="fas fa-boxes"></i> Inventario</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="customers.html"><i class="fas fa-users"></i> Clientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="reports.html"><i class="fas fa-chart-bar"></i> Reportes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Salir</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- POS Content -->
    <div class="container-fluid mt-4">
        <div class="row">
            <!-- Products Section -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <div class="row">
                            <div class="col-md-6">
                                <h5>Productos</h5>
                            </div>
                            <div class="col-md-6">
                                <input type="text" class="form-control" id="searchProduct" placeholder="Buscar producto por nombre o código...">
                            </div>
                        </div>
                    </div>
                    <div class="card-body" style="max-height: 600px; overflow-y: auto;">
                        <div class="row" id="productsGrid">
                            <!-- Products will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cart Section -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5><i class="fas fa-shopping-cart"></i> Carrito de Compras</h5>
                    </div>
                    <div class="card-body">
                        <!-- Customer Selection -->
                        <div class="mb-3">
                            <label class="form-label">Cliente (Opcional)</label>
                            <select class="form-select" id="customerSelect">
                                <option value="">Sin cliente</option>
                            </select>
                        </div>

                        <!-- Cart Items -->
                        <div id="cartItems" style="max-height: 300px; overflow-y: auto;">
                            <p class="text-center text-muted">Carrito vacío</p>
                        </div>

                        <!-- Totals -->
                        <hr>
                        <div class="mb-2">
                            <div class="d-flex justify-content-between">
                                <span>Subtotal:</span>
                                <strong id="subtotal">$0</strong>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span>Descuento:</span>
                                <strong id="discount">$0</strong>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="h5">Total:</span>
                                <strong class="h5 text-success" id="total">$0</strong>
                            </div>
                        </div>

                        <!-- Payment Method -->
                        <div class="mb-3">
                            <label class="form-label">Método de Pago</label>
                            <select class="form-select" id="paymentMethod">
                                <option value="cash">Efectivo</option>
                                <option value="card">Tarjeta</option>
                                <option value="transfer">Transferencia</option>
                            </select>
                        </div>

                        <!-- Actions -->
                        <div class="d-grid gap-2">
                            <button class="btn btn-success btn-lg" id="completeSale">
                                <i class="fas fa-check"></i> Completar Venta
                            </button>
                            <button class="btn btn-warning" id="clearCart">
                                <i class="fas fa-trash"></i> Limpiar Carrito
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sale Completed Modal -->
    <div class="modal fade" id="saleCompletedModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="fas fa-check-circle"></i> Venta Completada</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <i class="fas fa-check-circle fa-5x text-success mb-3"></i>
                    <h3>¡Venta exitosa!</h3>
                    <p class="mb-0">Número de venta: <strong id="saleNumber"></strong></p>
                    <p>Total: <strong id="saleTotal"></strong></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pos.js"></script>
</body>
</html>
