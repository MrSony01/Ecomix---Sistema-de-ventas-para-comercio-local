<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecomix - Sistema de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-store"></i> Ecomix
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="pos.html"><i class="fas fa-cash-register"></i> Punto de Venta</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="inventory.html"><i class="fas fa-boxes"></i> Inventario</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="customers.html"><i class="fas fa-users"></i> Clientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="reports.html"><i class="fas fa-chart-bar"></i> Reportes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Salir</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Dashboard -->
    <div class="container-fluid mt-4">
        <div class="row">
            <!-- Sales Summary -->
            <div class="col-md-3 mb-4">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="card-title">Ventas Hoy</h6>
                                <h3 id="todaySales">$0</h3>
                            </div>
                            <i class="fas fa-dollar-sign fa-3x opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Transactions Count -->
            <div class="col-md-3 mb-4">
                <div class="card text-white bg-info">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="card-title">Transacciones</h6>
                                <h3 id="transactionCount">0</h3>
                            </div>
                            <i class="fas fa-shopping-cart fa-3x opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Low Stock Products -->
            <div class="col-md-3 mb-4">
                <div class="card text-white bg-warning">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="card-title">Stock Bajo</h6>
                                <h3 id="lowStock">0</h3>
                            </div>
                            <i class="fas fa-exclamation-triangle fa-3x opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Customers -->
            <div class="col-md-3 mb-4">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="card-title">Clientes</h6>
                                <h3 id="customerCount">0</h3>
                            </div>
                            <i class="fas fa-users fa-3x opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="row mt-4">
            <div class="col-md-12">
                <h4>Accesos Rápidos</h4>
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <a href="pos.html" class="btn btn-lg btn-success w-100">
                            <i class="fas fa-cash-register"></i><br>Nueva Venta
                        </a>
                    </div>
                    <div class="col-md-3 mb-3">
                        <a href="inventory.html" class="btn btn-lg btn-primary w-100">
                            <i class="fas fa-box"></i><br>Agregar Producto
                        </a>
                    </div>
                    <div class="col-md-3 mb-3">
                        <a href="customers.html" class="btn btn-lg btn-info w-100">
                            <i class="fas fa-user-plus"></i><br>Nuevo Cliente
                        </a>
                    </div>
                    <div class="col-md-3 mb-3">
                        <a href="reports.html" class="btn btn-lg btn-warning w-100">
                            <i class="fas fa-file-alt"></i><br>Ver Reportes
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Sales -->
        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Ventas Recientes</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-striped" id="recentSalesTable">
                            <thead>
                                <tr>
                                    <th>Número</th>
                                    <th>Cliente</th>
                                    <th>Total</th>
                                    <th>Método de Pago</th>
                                    <th>Fecha</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Data will be loaded via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
